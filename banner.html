<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자세히보기 배너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  /* 스토리페이지(index.html)와 동일한 디자인 토큰 그대로 재사용 — 색상/폰트/모서리/그림자 통일 */
  :root{
    --green:#321F19; --green-d:#1a1108; --mango:#321F19; --mango-d:#1a1108;
    --cream:#fdf8ef; --ink:#3a3226; --sub:#7c7266; --line:#ece3d3;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:#e9e2d4;padding:20px}
  .page{max-width:480px;margin:0 auto}
  .serif{font-family:'Gowun Batang',serif}

  /* existing reservation card placeholder, for context only */
  .existing-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;opacity:.55}
  .existing-card .ph{width:52px;height:52px;border-radius:12px;background:var(--line);flex:0 0 auto}
  .existing-card .t{font-size:13px;color:var(--sub)}
  .existing-card .t b{display:block;font-size:14px;color:var(--mango-d);margin-bottom:2px}

  /* the new banner — 반반(50/50) 사진 스플릿, 스토리페이지와 동일한 브라운/크림 톤 */
  a.banner{display:block;text-decoration:none;border-radius:18px;overflow:hidden;background:var(--cream);
    box-shadow:0 10px 26px rgba(50,31,25,.16);border:1px solid var(--line)}
  .banner .photos{display:flex;height:150px}
  .banner .photos img{width:50%;height:100%;object-fit:cover;display:block}
  .banner .photos .r{object-position:60% 30%}
  .banner .bar{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .banner .badges{display:flex;gap:6px;margin-bottom:7px}
  .banner .badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1px;color:var(--mango-d);background:rgba(50,31,25,.08);padding:3px 9px;border-radius:20px}
  .banner .badge.soon{color:#a8481f;background:rgba(196,84,29,.12)}
  .banner .badge.live{color:#18995F;background:rgba(24,153,95,.12)}
  .banner h4{font-family:'Gowun Batang',serif;color:var(--ink);font-size:18px;font-weight:700;margin-bottom:3px}
  .banner p{color:var(--sub);font-size:12px;font-weight:500}
  .banner .cta{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;background:var(--mango-d);color:#fff;
    font-size:12.5px;font-weight:700;padding:10px 16px;border-radius:40px;box-shadow:0 6px 14px rgba(26,17,8,.28)}
  .banner .cta svg{width:12px;height:12px}

  .label{font-size:12px;color:var(--sub);text-align:center;margin-top:14px}

  /* 클릭 시 잠깐 떴다가 사라지는 토스트 */
  .toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(12px);
    background:var(--mango-d);color:#fff;font-size:13.5px;font-weight:700;
    padding:12px 20px;border-radius:40px;box-shadow:0 10px 24px rgba(0,0,0,.28);
    display:flex;align-items:center;gap:6px;white-space:nowrap;
    opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;z-index:10}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="page">

  <div class="existing-card">
    <div class="ph"></div>
    <div class="t"><b>예약하기</b>다회권으로 바로 예약 (기존 카드, 유지)</div>
  </div>

  <a class="banner" href="../coconut_page/index.html">
    <div class="photos">
      <img src="img/food_detail.jpg" alt="완성된 코코넛 치킨">
      <img class="r" src="img/act_crack.jpg" alt="반으로 쪼갠 코코넛 속살을 보며 웃는 아이">
    </div>
    <div class="bar">
      <div>
        <div class="badges">
          <span class="badge live">이번 시즌</span>
          <span class="badge">여름 오감 체험</span>
        </div>
        <h4>코코넛 섬 대모험</h4>
        <p>먼 바다를 건너온 코코넛 이야기</p>
      </div>
      <div class="cta">자세히보기
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
  </a>

  <div class="label">↑ 홈 화면 "예약하기" 카드 바로 아래 들어가는 신규 배너</div>
</div>
</body>
</html>
